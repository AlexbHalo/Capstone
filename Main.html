<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascend</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Your Journey to Ascension</h1>
  <h2 id="userNickname"></h2>

  <img src="Triple T Uno S.jpg" alt="Ascend Logo" id="logo" width="50" height="40">

  <div id="themeControls">
    <button id="themeToggle">Light Mode</button>
    <button id="customModeBtn">Custom Mode</button>
  </div>

  <br><br><br><br>

  <div id="timerSetup">
    <p class="assignment-row" style="display: flex; align-items: center;">
      <label style="margin-right: 10px;">
        Assignment/Task:
        <input type="text" id="assignmentName" placeholder="What are you working on?">
      </label>
      <select id="assignmentHistory" style="margin-left: 10px;"></select>
    </p>

    <p>
      <label>Work minutes: <input type="number" id="workMinutes" min="1" value="25"></label>
      <label>Break minutes: <input type="number" id="breakMinutes" min="1" value="5"></label>
    </p>

    <button id="beginBtn" disabled>Begin Working</button>
  </div>

  <a href="HTML.html"><button>Back to Log-In</button></a>
  <a href="worklog.html"><button>View Work Log</button></a>
  <a href="Adapt.html"><button>ASCEND</button></a>

  <!-- CUSTOM COLORS -->
  <div id="customModeDialog">
    <h3>Custom Mode Colors</h3>
    <div class="color-picker-row">
      <label>Base<input type="color" id="customBaseColor"></label>
      <label>Primary<input type="color" id="customPrimaryColor"></label>
      <label>Sub<input type="color" id="customSubColor"></label>
    </div>

    <div class="modal-actions">
      <button id="saveCustomMode">Save</button>
      <button id="resetCustomMode">Reset</button>
      <button id="cancelCustomMode">Cancel</button>
    </div>
  </div>

  <div id="customModeOverlay"></div>


  <!-- ========================= -->
  <!-- SCRIPTS (ORDER MATTERS) -->
  <!-- ========================= -->
  <script src="storage.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
  <script src="script.js"></script>

  <!-- ========================= -->
  <!-- PAGE LOGIC -->
  <!-- ========================= -->
  <script>
  initTheme();
  document.addEventListener('DOMContentLoaded', function(){

    // 👤 Ensure logged in
    const user = getCurrentUser();
    if (!user) {
      window.location.href = 'HTML.html';
      return;
    }

    // 👤 Show nickname
    try {
      const usersRaw = localStorage.getItem('users');
      const users = usersRaw ? JSON.parse(usersRaw) : {};
      const nick = users[user] ? users[user].nickname : '';
      const el = document.getElementById('userNickname');
      if (el) el.textContent = nick ? ` ${nick}` : '';
    } catch (err) {}

    // 🌙 Load theme
    const savedTheme = loadTheme();
    document.documentElement.setAttribute('data-theme', savedTheme);

    // 🎨 Load colors
    const customColors = loadCustomColors();
    if (customColors) applyCustomColors(customColors);

    // =====================
    // THEME BUTTON
    // =====================
    const themeToggle = document.getElementById('themeToggle');

    if (themeToggle) {
      themeToggle.textContent = savedTheme === 'dark' ? 'Light Mode' : 'Dark Mode';

      themeToggle.addEventListener('click', function(){
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        saveTheme(newTheme);

        themeToggle.textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';

        const colors = loadCustomColors();
        if (colors) applyCustomColors(colors);
      });
    }

    // =====================
    // CUSTOM COLORS
    // =====================
    const customModeBtn = document.getElementById('customModeBtn');
    const dialog = document.getElementById('customModeDialog');
    const overlay = document.getElementById('customModeOverlay');

    const baseInput = document.getElementById('customBaseColor');
    const primaryInput = document.getElementById('customPrimaryColor');
    const subInput = document.getElementById('customSubColor');

    const saveBtn = document.getElementById('saveCustomMode');
    const cancelBtn = document.getElementById('cancelCustomMode');
    const resetBtn = document.getElementById('resetCustomMode');

    function openDialog() {
      const current = loadCustomColors();
      if (current) {
        baseInput.value = current.base;
        primaryInput.value = current.primary;
        subInput.value = current.sub;
      }
      dialog.style.display = 'block';
      overlay.style.display = 'block';
    }

    function closeDialog() {
      dialog.style.display = 'none';
      overlay.style.display = 'none';
    }

    if (customModeBtn) customModeBtn.onclick = openDialog;
    if (cancelBtn) cancelBtn.onclick = closeDialog;
    if (overlay) overlay.onclick = closeDialog;

    if (saveBtn) {
      saveBtn.onclick = function(){
        const colors = {
          base: baseInput.value,
          primary: primaryInput.value,
          sub: subInput.value
        };
        saveCustomColors(colors);
        applyCustomColors(colors);
        closeDialog();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = function(){
        saveCustomColors(null);
        document.documentElement.style.removeProperty('--bg-primary');
        document.documentElement.style.removeProperty('--accent-color');
        document.documentElement.style.removeProperty('--bg-secondary');
        closeDialog();
      };
    }

    // =====================
    // TIMER SETUP
    // =====================
    const assignmentInput = document.getElementById('assignmentName');
    const assignmentHistory = document.getElementById('assignmentHistory');
    const workInput = document.getElementById('workMinutes');
    const breakInput = document.getElementById('breakMinutes');
    const beginBtn = document.getElementById('beginBtn');

    const settings = loadTimerSettings();
    workInput.value = settings.work;
    breakInput.value = settings.break;
    function updateBeginState(){
      const w = parseInt(workInput.value,10);
      const b = parseInt(breakInput.value,10);
      const a = assignmentInput.value && assignmentInput.value.trim().length > 0;
      beginBtn.disabled = !(w >= 1 && b >= 1 && a);
    }

    if (workInput && breakInput && beginBtn){

      workInput.addEventListener('input', updateBeginState);
      breakInput.addEventListener('input', updateBeginState);
      assignmentInput.addEventListener('input', updateBeginState);

      updateBeginState();

      beginBtn.addEventListener('click', function(){
        const w = Math.max(1, parseInt(workInput.value,10) || 25);
        const b = Math.max(1, parseInt(breakInput.value,10) || 5);

        // SAVE PER USER
        localStorage.setItem(`workMinutes_${user}`, String(w));
        localStorage.setItem(`breakMinutes_${user}`, String(b));
        
        // =====================
        // LOAD LAST TIMER VALUES
        // =====================
        const savedWork = localStorage.getItem(`workMinutes_${user}`);
        const savedBreak = localStorage.getItem(`breakMinutes_${user}`);

        if (savedWork) workInput.value = savedWork;
        if (savedBreak) breakInput.value = savedBreak;

        const assignment = assignmentInput.value.trim();
        localStorage.setItem(`currentAssignment_${user}`, assignment);
        localStorage.setItem(`currentAssignmentStart_${user}`, String(Date.now()));

        window.location.href = 'Timer.html';
      });
    }

  });
  </script>

</body>
</html>
