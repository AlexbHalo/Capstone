<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Log</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Work Log</h1>
    <div id="themeControls">
      <button id="themeToggle">Light Mode</button>
      <button id="customModeBtn">Custom Mode</button>
    </div>
    <p>A record of started and completed work by you!</p>
    <a href="Main.html"><button>Back</button></a>

    <div id="customModeDialog">
      <h3>Custom Mode Colors</h3>
      <div class="color-picker-row">
        <label>Base<input type="color" id="customBaseColor"></label>
        <label>Primary<input type="color" id="customPrimaryColor"></label>
        <label>Sub<input type="color" id="customSubColor"></label>
      </div>
      <div class="modal-actions">
        <button id="saveCustomMode">Save</button>
        <button id="resetCustomMode">Reset</button>
        <button id="cancelCustomMode">Cancel</button>
      </div>
    </div>
    <div id="customModeOverlay"></div>
    
    <script>
      // Apply saved theme
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Theme toggle setup
      const themeToggle = document.getElementById('themeToggle');
      const customModeBtn = document.getElementById('customModeBtn');
      const customModeDialog = document.getElementById('customModeDialog');
      const customModeOverlay = document.getElementById('customModeOverlay');
      const customBaseColor = document.getElementById('customBaseColor');
      const customPrimaryColor = document.getElementById('customPrimaryColor');
      const customSubColor = document.getElementById('customSubColor');
      const saveCustomModeBtn = document.getElementById('saveCustomMode');
      const cancelCustomModeBtn = document.getElementById('cancelCustomMode');
      const resetCustomModeBtn = document.getElementById('resetCustomMode');

      themeToggle.textContent = savedTheme === 'dark' ? 'Light Mode' : 'Dark Mode';

      let customColors = null;
      function toHex(color) {
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = color;
        return ctx.fillStyle;
      }
      function applyCustomColors(colors) {
        if (!colors) return;
        document.documentElement.style.setProperty('--bg-primary', colors.base);
        document.documentElement.style.setProperty('--accent-color', colors.primary);
        document.documentElement.style.setProperty('--bg-secondary', colors.sub);
      }
      function loadCustomColors() {
        try {
          const stored = localStorage.getItem('customColors');
          if (stored) {
            customColors = JSON.parse(stored);
            applyCustomColors(customColors);
          }
        } catch (err) {}
      }
      function closeCustomModeDialog() {
        if (customModeDialog) customModeDialog.style.display = 'none';
        if (customModeOverlay) customModeOverlay.style.display = 'none';
      }
      function openCustomModeDialog() {
        const styles = getComputedStyle(document.documentElement);
        const current = customColors || {
          base: toHex(styles.getPropertyValue('--bg-primary').trim()),
          primary: toHex(styles.getPropertyValue('--accent-color').trim()),
          sub: toHex(styles.getPropertyValue('--bg-secondary').trim())
        };
        customBaseColor.value = current.base;
        customPrimaryColor.value = current.primary;
        customSubColor.value = current.sub;
        if (customModeDialog) customModeDialog.style.display = 'block';
        if (customModeOverlay) customModeOverlay.style.display = 'block';
      }
      function resetCustomMode() {
        localStorage.removeItem('customColors');
        customColors = null;
        document.documentElement.style.removeProperty('--bg-primary');
        document.documentElement.style.removeProperty('--accent-color');
        document.documentElement.style.removeProperty('--bg-secondary');
        closeCustomModeDialog();
      }
      function saveCustomMode() {
        customColors = {
          base: customBaseColor.value,
          primary: customPrimaryColor.value,
          sub: customSubColor.value
        };
        localStorage.setItem('customColors', JSON.stringify(customColors));
        applyCustomColors(customColors);
        // Force a style recalculation
        document.documentElement.style.display = 'none';
        setTimeout(function() {
          document.documentElement.style.display = '';
        }, 10);
        closeCustomModeDialog();
      }

      themeToggle.addEventListener('click', function(){
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
        if (customColors) applyCustomColors(customColors);
      });
      if (customModeBtn) customModeBtn.addEventListener('click', openCustomModeDialog);
      if (saveCustomModeBtn) saveCustomModeBtn.addEventListener('click', saveCustomMode);
      if (cancelCustomModeBtn) cancelCustomModeBtn.addEventListener('click', closeCustomModeDialog);
      if (resetCustomModeBtn) resetCustomModeBtn.addEventListener('click', resetCustomMode);
      if (customModeOverlay) customModeOverlay.addEventListener('click', closeCustomModeDialog);
      loadCustomColors();
    </script>
    
    <div id="filterSection" style="margin: 20px auto; padding: 20px; background-color: #222; border-radius: 8px; max-width: 600px; text-align: left;">
      <h3 style="margin-top: 0; color: var(--accent-color);">Filter Entries</h3>
      <p style="margin: 10px 0;">
        <label style="display: block; margin-bottom: 10px;">
          Assignment Name:
          <input type="text" id="filterAssignment" placeholder="Search by task name..." style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid var(--accent-color) !important; background-color: var(--bg-secondary) !important; color: inherit !important;">
        </label>
      </p>
      <p style="margin: 10px 0;">
        <label style="display: block; margin-bottom: 10px;">
          Completion Status:
          <select id="filterStatus" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid var(--accent-color) !important; background-color: var(--bg-secondary) !important; color: inherit !important;">
            <option value="all">All</option>
            <option value="completed">Completed only</option>
            <option value="uncompleted">Uncompleted only</option>
          </select>
        </label>
      </p>
      <p style="margin: 10px 0;">
        <label style="display: block; margin-bottom: 10px;">
          Date From:
          <input type="date" id="filterDateFrom" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid var(--accent-color) !important; background-color: var(--bg-secondary) !important; color: inherit !important;">
        </label>
      </p>
      <p style="margin: 10px 0;">
        <label style="display: block; margin-bottom: 10px;">
          Date To:
          <input type="date" id="filterDateTo" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid var(--accent-color) !important; background-color: var(--bg-secondary) !important; color: inherit !important;">
        </label>
      </p>
      <button id="clearFilters" style="width: 100%; padding: 10px; background-color: #666; color: white; border: none; border-radius: 4px; cursor: pointer;">Clear Filters</button>
    </div>

    <div id="logContainer">
      <pre id="log">Loading...</pre>
    </div>
    <script>
      // Load the WORKLOG.md file and display as preformatted text,
      // then append any recorded sessions from localStorage.
      (function(){
        const user = localStorage.getItem('currentUser');
        const sessionsRaw = localStorage.getItem(`workSessions_${user}`);
        const out = document.getElementById('log');
        const filterAssignmentInput = document.getElementById('filterAssignment');
        const filterStatus = document.getElementById('filterStatus');
        const filterDateFromInput = document.getElementById('filterDateFrom');
        const filterDateToInput = document.getElementById('filterDateTo');
        const clearFiltersBtn = document.getElementById('clearFilters');
        
        let baseText = '';
        let allSessions = [];
        
        function fmtDate(ts){
          const d = new Date(ts);
          return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        }
        
        function getDateOnly(ts){
          const d = new Date(ts);
          return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        
        function filterSessions(sessions){
          const assignmentFilter = filterAssignmentInput.value.toLowerCase().trim();
          const statusFilter = filterStatus.value;
          const dateFromFilter = filterDateFromInput.value; // YYYY-MM-DD
          const dateToFilter = filterDateToInput.value;     // YYYY-MM-DD
          
          return sessions.filter(s => {
            // Filter by assignment name
            if (assignmentFilter && !s.assignment.toLowerCase().includes(assignmentFilter)) {
              return false;
            }
            
            // Filter by status
            if (statusFilter === 'completed' && !s.completed) {
              return false;
            }
            if (statusFilter === 'uncompleted' && s.completed) {
              return false;
            }
            
            // Filter by date range
            const sessionDate = getDateOnly(s.start);
            if (dateFromFilter && sessionDate < dateFromFilter) {
              return false;
            }
            if (dateToFilter && sessionDate > dateToFilter) {
              return false;
            }
            
            return true;
          });
        }
        
        function escapeHtml(value){
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function renderCombined(base, sessions){
          const filteredSessions = filterSessions(sessions);
          let html = escapeHtml(base);
          if (base) html += '\n\n';
          html += escapeHtml('Recorded Sessions (from this browser):\n');
          if (!filteredSessions || !filteredSessions.length) {
            html += escapeHtml('(no recorded sessions matching filters)\n');
          } else {
            filteredSessions.forEach(s => {
              const completedTag = s.completed ? ` <span style="color: var(--accent-color);">[completed]</span>` : '';
              html += escapeHtml(`- ${fmtDate(s.start)} → ${fmtDate(s.end)} (${s.minutes} min): ${s.assignment}`) + completedTag + '\n';
            });
          }
          out.innerHTML = html;
        }
        
        function rerender(){
          renderCombined(baseText, allSessions);
        }

        fetch('WORKLOG.md').then(r => r.text()).then(base => {
          baseText = base;
          try {
            const sessionsRaw = localStorage.getItem('workSessions');
            allSessions = sessionsRaw ? JSON.parse(sessionsRaw) : [];
            rerender();
          } catch (err) { 
            allSessions = [];
            rerender();
          }
        }).catch(() => {
          baseText = '';
          try {
            allSessions = getWorkSessions();
          } catch (err) {
            allSessions = [];
          }
          rerender();
        });
        
        // Add event listeners to filter inputs
        filterAssignmentInput.addEventListener('input', rerender);
        filterStatus.addEventListener('change', rerender);
        filterDateFromInput.addEventListener('change', rerender);
        filterDateToInput.addEventListener('change', rerender);
        
        clearFiltersBtn.addEventListener('click', function(){
          filterAssignmentInput.value = '';
          filterStatus.value = 'all';
          filterDateFromInput.value = '';
          filterDateToInput.value = '';
          rerender();
        });
      })();
    </script>
    <script src="storage.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
  </body>
</html>
