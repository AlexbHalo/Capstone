<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Log</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Work Log</h1>

<!-- THEME CONTROLS -->
<div id="themeControls">
  <button id="themeToggle">Light Mode</button>
  <button id="customModeBtn">Custom Mode</button>
</div>

<!-- CUSTOM MODE UI -->
<div id="customModeDialog">
  <h3>Custom Mode Colors</h3>
  <div class="color-picker-row">
    <label>Base<input type="color" id="customBaseColor"></label>
    <label>Primary<input type="color" id="customPrimaryColor"></label>
    <label>Sub<input type="color" id="customSubColor"></label>
  </div>

  <div class="modal-actions">
    <button id="saveCustomMode">Save</button>
    <button id="resetCustomMode">Reset</button>
    <button id="cancelCustomMode">Cancel</button>
  </div>
</div>

<div id="customModeOverlay"></div>

<button onclick="window.location.href='Main.html'">Back</button>

<!-- FILTERS -->
<div id="filterSection">
  <h3>Filter</h3>

  <input id="filterAssignment" placeholder="Search assignment">

  <select id="filterStatus">
    <option value="all">All</option>
    <option value="completed">Completed</option>
    <option value="uncompleted">Uncompleted</option>
  </select>

  <input type="date" id="filterDateFrom">
  <input type="date" id="filterDateTo">

  <button id="clearFilters">Clear</button>
</div>

<!-- LOG OUTPUT -->
<div id="logContainer"></div>

<!-- IMPORTANT: LOAD SCRIPTS FIRST -->
<script src="storage.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<script>
const user = localStorage.getItem('currentUser');

if (!user) {
  alert("No user found.");
  window.location.href = "Main.html";
}

// =====================
// MAIN LOGIC
// =====================
(function(){

  const container = document.getElementById('logContainer');

  const filterAssignment = document.getElementById('filterAssignment');
  const filterStatus = document.getElementById('filterStatus');
  const filterDateFrom = document.getElementById('filterDateFrom');
  const filterDateTo = document.getElementById('filterDateTo');
  const clearBtn = document.getElementById('clearFilters');

  let sessions = [];

  function loadSessions(){
    try {
      sessions = getWorkSessions(); // ✅ uses user-based storage
    } catch(e){
      sessions = [];
    }
  }

  function format(ts){
    return new Date(ts).toLocaleString();
  }

  function passFilters(s){

    if (filterAssignment.value &&
        !s.assignment.toLowerCase().includes(filterAssignment.value.toLowerCase())){
      return false;
    }

    if (filterStatus.value === 'completed' && !s.completed) return false;
    if (filterStatus.value === 'uncompleted' && s.completed) return false;

    const d = new Date(s.start).toISOString().slice(0,10);

    if (filterDateFrom.value && d < filterDateFrom.value) return false;
    if (filterDateTo.value && d > filterDateTo.value) return false;

    return true;
  }

  function render(){

    const filtered = sessions.filter(passFilters);

    if (!filtered.length){
      container.innerHTML = "<p>No sessions found</p>";
      return;
    }

    container.innerHTML = filtered.map(s => `
      <div style="border:1px solid var(--accent-color); margin:10px; padding:10px; border-radius:6px;">
        <strong>${s.assignment}</strong><br>
        ${format(s.start)} → ${format(s.end)}<br>
        ${s.minutes} minutes<br>
        ${s.completed
          ? '<span style="color:lime;">Completed</span>'
          : '<span style="color:red;">Not completed</span>'}
      </div>
    `).join('');
  }

  // EVENTS
  filterAssignment.oninput = render;
  filterStatus.onchange = render;
  filterDateFrom.onchange = render;
  filterDateTo.onchange = render;

  clearBtn.onclick = () => {
    filterAssignment.value = '';
    filterStatus.value = 'all';
    filterDateFrom.value = '';
    filterDateTo.value = '';
    render();
  };

  // INIT
  loadSessions();
  render();

})();
</script>

</body>
</html>
