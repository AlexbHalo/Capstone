<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Timer</h1>
    <div id="mode">Mode: <span id="modeName">Work</span></div>
    <div id="timerDisplay">00:00</div>
    <div>
      <button id="pauseBtn">Pause</button>
      <a href="Main.html"><button>Back</button></a>
    </div>
    <script>
    (function(){
      const display = document.getElementById('timerDisplay');
      const modeName = document.getElementById('modeName');
      const pauseBtn = document.getElementById('pauseBtn');

      let workMinutes = parseInt(localStorage.getItem('workMinutes'),10);
      let breakMinutes = parseInt(localStorage.getItem('breakMinutes'),10);
      if (isNaN(workMinutes) || workMinutes < 1) workMinutes = 25;
      if (isNaN(breakMinutes) || breakMinutes < 1) breakMinutes = 5;

      let mode = 'work'; // 'work' or 'break'
      let remaining = workMinutes * 60;
      let interval = null;
      let paused = false;

      function formatTime(s){
        const m = Math.floor(s/60);
        const sec = s % 60;
        return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
      }

      function render(){
        display.textContent = formatTime(remaining);
        modeName.textContent = mode === 'work' ? 'Work' : 'Break';
      }

      function startInterval(){
        if (interval) return;
        interval = setInterval(function(){
          if (paused) return;
          remaining -= 1;
          if (remaining <= 0){
            clearInterval(interval); interval = null;
            if (mode === 'work'){
              // record the completed work session
              try {
                const assignment = localStorage.getItem('currentAssignment') || 'Untitled';
                const startMs = parseInt(localStorage.getItem('currentAssignmentStart'),10) || (Date.now() - workMinutes*60*1000);
                const endMs = Date.now();
                const minutes = Math.round((endMs - startMs)/60000);
                const sessionsRaw = localStorage.getItem('workSessions');
                const sessions = sessionsRaw ? JSON.parse(sessionsRaw) : [];
                sessions.push({ assignment, start: startMs, end: endMs, minutes });
                localStorage.setItem('workSessions', JSON.stringify(sessions));
              } catch (err) {}
              alert('Work period complete — starting break.');
              mode = 'break';
              remaining = breakMinutes * 60;
              render();
              startInterval();
              return;
            } else {
              // break finished: clear current assignment and return to Main
              try {
                localStorage.removeItem('currentAssignment');
                localStorage.removeItem('currentAssignmentStart');
              } catch (err) {}
              alert('Break complete — returning to Main.');
              window.location.href = 'Main.html';
              return;
            }
          }
          render();
        }, 1000);
      }

      pauseBtn.addEventListener('click', function(){
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
      });
      // Stop control removed; use Back to return or Pause to pause/resume

      // initialize and auto-start
      render();
      // start shortly to allow UI render
      setTimeout(startInterval, 300);
    })();
    </script>
  </body>
</html>
