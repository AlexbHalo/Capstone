<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Timer</h1>

  <div id="themeControls">
    <button id="themeToggle">Light Mode</button>
    <button id="customModeBtn">Custom Mode</button>
  </div>

    <!-- CUSTOM COLORS -->
  <div id="customModeDialog">
    <h3>Custom Mode Colors</h3>
    <div class="color-picker-row">
      <label>Base<input type="color" id="customBaseColor"></label>
      <label>Primary<input type="color" id="customPrimaryColor"></label>
      <label>Sub<input type="color" id="customSubColor"></label>
    </div>

    <div class="modal-actions">
      <button id="saveCustomMode">Save</button>
      <button id="resetCustomMode">Reset</button>
      <button id="cancelCustomMode">Cancel</button>
    </div>
  </div>

  <div id="customModeOverlay"></div>
  
<h2 id="assignmentDisplay"></h2>

<div id="mode">Mode: <span id="modeName">Work</span></div>
<div id="timerDisplay">00:00</div>

<div>
  <button id="pauseBtn">Pause</button>
  <button id="completedBtn">Completed</button>
  <button onclick="window.location.href='Main.html'">Back</button>
</div>

<div id="progressBarContainer">
  <div id="progressBarFill"></div>
</div>

<button id="loopToggle">loop mode: on</button>

<!-- Confirm dialog -->
<div id="confirmDialog" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgb(0, 0, 0);padding:30px;border-radius:10px;z-index:999;">
  <p>Are you done?</p>
  <button id="confirmYes">Yes</button>
  <button id="confirmNo">No</button>
</div>

<div id="dialogOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:998;"></div>

<script src="storage.js"></script>
<script src="app.js"></script>

<script>
const user = localStorage.getItem('currentUser');

if (!user) {
  alert("No user found.");
  window.location.href = "Main.html";
}

// MAIN TIMER LOGIC
(function(){

  // DOM
  const display = document.getElementById('timerDisplay');
  const modeName = document.getElementById('modeName');
  const pauseBtn = document.getElementById('pauseBtn');
  const completedBtn = document.getElementById('completedBtn');
  const assignmentDisplay = document.getElementById('assignmentDisplay');
  const progressBarFill = document.getElementById('progressBarFill');
  const loopToggle = document.getElementById('loopToggle');

  // DATA
  let workMinutes = parseInt(localStorage.getItem(`workMinutes_${user}`), 10);
  let breakMinutes = parseInt(localStorage.getItem(`breakMinutes_${user}`), 10);

  if (isNaN(workMinutes) || workMinutes < 1) workMinutes = 25;
  if (isNaN(breakMinutes) || breakMinutes < 1) breakMinutes = 5;

  const currentAssignment = localStorage.getItem(`currentAssignment_${user}`) || 'Untitled';
  assignmentDisplay.textContent = currentAssignment;

  // LOOP MODE
  let loopMode = true;
  const savedLoopMode = localStorage.getItem('loopMode');
  if (savedLoopMode !== null) {
    loopMode = savedLoopMode === 'true';
  }

  function updateLoopText(){
    loopToggle.textContent = loopMode ? 'loop mode: on' : 'loop mode: off';
  }

  loopToggle.addEventListener('click', function(){
    loopMode = !loopMode;
    localStorage.setItem('loopMode', loopMode);
    updateLoopText();
  });

  updateLoopText();

  // TIMER STATE
  let mode = 'work';
  let remaining = workMinutes * 60;
  let totalTime = remaining;
  let paused = false;
  let interval = null;

  // CONTROLS
  pauseBtn.onclick = () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  };

  // COMPLETE BUTTON
  const confirmDialog = document.getElementById('confirmDialog');
  const dialogOverlay = document.getElementById('dialogOverlay');

  completedBtn.onclick = () => {
    confirmDialog.style.display = 'block';
    dialogOverlay.style.display = 'block';
  };

  document.getElementById('confirmYes').onclick = () => {
    saveSession(true);
    window.location.href = 'worklog.html';
  };

  document.getElementById('confirmNo').onclick = () => {
    confirmDialog.style.display = 'none';
    dialogOverlay.style.display = 'none';
  };

  function saveSession(completed){
    try {
      const startMs = parseInt(localStorage.getItem(`currentAssignmentStart_${user}`),10) 
        || (Date.now() - workMinutes*60000);

      const endMs = Date.now();

      addWorkSession({
        assignment: currentAssignment,
        start: startMs,
        end: endMs,
        minutes: Math.round((endMs - startMs)/60000),
        completed: completed
      });

    } catch(e){}
  }

  // DISPLAY
  function formatTime(s){
    const m = Math.floor(s/60);
    const sec = s % 60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function render(){
    display.textContent = formatTime(remaining);
    modeName.textContent = mode === 'work' ? 'Work' : 'Break';

    const progress = totalTime > 0 ? (totalTime - remaining)/totalTime : 0;
    progressBarFill.style.width = (progress*100) + '%';
  }

  // TIMER LOOP
  function start(){
    interval = setInterval(() => {

      if (paused) return;

      remaining--;

      if (remaining <= 0){

        if (mode === 'work'){
          saveSession(true);

          alert('Work done → break');

          mode = 'break';
          remaining = breakMinutes * 60;
          totalTime = remaining;
        } else {

          if (loopMode){
            localStorage.setItem(`currentAssignmentStart_${user}`, Date.now());

            mode = 'work';
            remaining = workMinutes * 60;
            totalTime = remaining;
          } else {
            alert('Done');
            window.location.href = 'Main.html';
            return;
          }
        }
      }

      render();

    }, 1000);
  }

  render();
  start();

})();
</script>

</body>
</html>
