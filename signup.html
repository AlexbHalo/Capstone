<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Begin Jekyll SEO tag v2.8.0 -->
<title>Sign-up</title>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script>
      // Always use dark theme on signup page
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <h1>Create An Account</h1>
    <div id="signupForm" class="show">
      <p>Username: <input type="text" id="signupUsername"></p>
      <p>Password: <input type="password" id="signupPassword"></p>
      <p>Nickname: <input type="text" id="signupNickname"></p>
    </div>
    <br></br>
	  <br></br>
    <br></br>
	  <br></br>
    <button id="createBtn" disabled onclick="return createAccount(event)">Create</button>
    <a href="HTML.html">
      <button>Back to Log-In</button>
    </a>
    <script>
    const BLANK_MSG = 'Can Not Be Left Blank';
    function updateCreateState() {
      const u = document.getElementById('signupUsername');
      const p = document.getElementById('signupPassword');
      const n = document.getElementById('signupNickname');
      const createBtn = document.getElementById('createBtn');
      if (!u || !p || !n || !createBtn) return;
      const allFilled = u.value && u.value !== BLANK_MSG && p.value && p.value !== BLANK_MSG && n.value && n.value !== BLANK_MSG;
      createBtn.disabled = !allFilled;
    }
    function createAccount(e) {
      const ok = validateSignup(e);
      if (!ok) {
        updateCreateState();
        return false;
      }
      const u = document.getElementById('signupUsername').value.trim();
      const p = document.getElementById('signupPassword').value;
      const n = document.getElementById('signupNickname').value.trim();
      // save account into a `users` object in localStorage
      try {
        const usersRaw = localStorage.getItem('users');
        const users = usersRaw ? JSON.parse(usersRaw) : {};
        if (users[u]) {
          alert('Username already exists — choose another.');
          return false;
        }
        users[u] = { password: p, nickname: n };
        localStorage.setItem('users', JSON.stringify(users));
      } catch (err) {}
      alert('Account created (demo). You can now Log-In.');
      return false;
    }
    function validateSignup() {
      const u = document.getElementById('signupUsername');
      const p = document.getElementById('signupPassword');
      const n = document.getElementById('signupNickname');
      let blocked = false;
      [u,p,n].forEach(el => {
        if (!el.value) {
          // if it's a password, temporarily show message by switching to text
          if (el.type === 'password') { el.dataset.origType = 'password'; el.type = 'text'; }
          el.value = BLANK_MSG;
          el.classList.add('blank');
          blocked = true;
        }
      });
      return !blocked;
    }

    function backToLogin(e) {
      // navigate to login page without validating or showing warnings
      window.location.href = 'HTML.html';
      return false;
    }
    document.addEventListener('DOMContentLoaded', function(){
      ['signupUsername','signupPassword','signupNickname'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', updateCreateState);
        el.addEventListener('focus', function(){
          if (this.value === BLANK_MSG) {
            this.value='';
            this.classList.remove('blank');
            // restore password type if we changed it
            if (this.dataset.origType) { this.type = this.dataset.origType; delete this.dataset.origType; }
          }
        });
        el.addEventListener('blur', function(){
          if (!this.value) {
            // temporarily switch password to text to show message
            if (this.type === 'password') { this.dataset.origType = 'password'; this.type = 'text'; }
            this.value = BLANK_MSG;
            this.classList.add('blank');
            updateCreateState();
          }
        });
      });
      // initialize button state
      updateCreateState();
    });
    </script>
</body>
</head>
</html>
